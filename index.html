<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BTC Indicators</title>
  <meta name="description" content="Free Bitcoin indicators dashboard: cycle, trading, on-chain and network signals.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23f7931a'/><text x='16' y='23' font-size='20' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'>₿</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <span class="logo" aria-hidden="true">₿</span>
        <h1>BTC Indicators</h1>
      </div>
      <div class="ticker">
        <span id="price" class="price">—</span>
        <span id="change" class="change" hidden></span>
        <span id="price-stale" class="price-stale" hidden>cached</span>
      </div>
      <div class="actions">
        <span id="updated" class="updated">Loading…</span>
        <button id="refresh" class="refresh" type="button">
          <span class="spinner" aria-hidden="true"></span>
          <span class="refresh-label">Refresh</span>
        </button>
      </div>
    </div>
  </header>

  <main id="sections" class="wrap"></main>

  <footer class="wrap footer">
    <p class="disclaimer"><strong>Educational only, not financial advice.</strong> Signals are rules of thumb based on past cycles.</p>
    <p class="sources">
      Data:
      <a href="https://docs.kraken.com/api/docs/rest-api/get-ohlc-data" target="_blank" rel="noopener">Kraken</a> ·
      <a href="https://docs.cdp.coinbase.com/exchange/reference/exchangerestapi_getproductcandles" target="_blank" rel="noopener">Coinbase</a> (backup) ·
      <a href="https://hyperliquid.gitbook.io/hyperliquid-docs/for-developers/api/info-endpoint" target="_blank" rel="noopener">Hyperliquid</a> ·
      <a href="https://alternative.me/crypto/fear-and-greed-index/" target="_blank" rel="noopener">alternative.me</a> ·
      <a href="https://mempool.space/" target="_blank" rel="noopener">mempool.space</a> ·
      <a href="https://bitcoin-data.com/" target="_blank" rel="noopener">bitcoin-data.com</a>
    </p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/sources.js"></script>
  <script src="js/indicators.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
